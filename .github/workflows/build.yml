name: Windows alpha build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.427'
      - name: Fetch and verify upstream assets
        shell: pwsh
        run: |
          ./scripts/fetch-dependencies.ps1
          ./scripts/fetch-build-notices.ps1
          ./scripts/get-signing-tools.ps1
      - name: Build reviewed fan-engine patch
        shell: pwsh
        run: ./scripts/build-fan-engine.ps1
      - name: Build native bridge and isolated fan protocol tests
        shell: pwsh
        run: ./scripts/build-native.ps1
      - name: Build portable desktop
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -SkipInstaller
      - name: Check application and package
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-release.ps1
          ./scripts/package-source.ps1
          ./scripts/verify-archives.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-alpha-windows-x64
          path: artifacts/releases/*0.4.0-alpha.30*.zip
          retention-days: 14
# CI artifacts are development builds. This workflow never publishes a release.
